<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinoura</title>
</head>
<body>
    <header>
        <img class="logo" src="assets/logo.png" alt="logo del sitio web kinoura">
        <nav>
            <ul>
                <li><a href="./">Kinoura</a></li>
                <li><a href="./pages/cines.html">Cines</a></li>
                <li><a href="./pages/peliculas.html">Películas</a></li>
                <li><a href="./pages/promociones.html">Promociones</a></li>
                <li><a href="./pages/nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="banner">
            <img src="assets/banner.jpg" alt="Baner publicitando el re-estreno de Avengers Endgame">
        </div>

<!-- Q? un h1 va dentro o fuera de un section?? -->
        <section class="movies-container-home">
            <h1>Películas</h1>
            <!-- 
            Estos son controles NO para cambiar de página, sino para mostrar contenido
            (las películas) de manera dinámica dependiendo de la selección del usuario 
            -->
            <div class="movies-tabs">
                <button type="button">En cartelera</button>
                <button type="button">Próximos estrenos</button>
                <button type="button">Preventa</button>
            </div>

            <!-- 
            En esta sección, dependiendo del botón (tab) seleccionado, se debería cambiar
            cambiar las películas que se muestren, pero la estructura sería la misma.
            -->
            <div class="movies-display">
                <ul>
                    <li><img src="assets/pelicula_1.jpg" alt="póster de la película Avengers Endgame"></li>
                    <li><img src="assets/pelicula_2.jpg" alt="póster de la película Avatar: Fuego y ceniza"></li>
                    <li><img src="assets/pelicula_3.jpg" alt="póster de la película Spiderman into the Spiderverse"></li>
                    <li><img src="assets/pelicula_4.jpg" alt="póster de la película Flow"></li>
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <nav>
            <ul>
                <li><a href="#">Términos y condiciones</a></li>
                <li><a href="#">Trabaja con nosotros</a></li>

    </footer>

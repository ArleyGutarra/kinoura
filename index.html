<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinoura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<!-- 
<li><a href="./pages/peliculas.html">Películas</a></li>
<li><a href="./pages/cines.html">Cines</a></li>
<li><a href="./pages/promociones.html">Promociones</a></li>
<li><a href="./pages/nosotros.html">Nosotros</a></li> 
-->

<body>
    <header>
        <nav class="main-navbar navbar md:navbar-expand bg-1" data-bs-theme="dark">
            <div class="container-fluid">
                <!-- Main Heading: Kinoura -->
                <a class="navbar-brand" href="#"><img src="./assets/kinoura-logo-white.png"
                        alt="Botón a Home con el logo de Kinoura"></a>

                <!-- Icono de Menu Hamburgesa-->
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarDarkDrawer" aria-controls="navbarDarkDrawer" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <dialog class="drawer drawer-end" tabindex="-1" id="navbarDarkDrawer"
                    aria-labelledby="navbarDarkDrawerLabel">
                    <div class="drawer-header">
                        <p class="drawer-title" id="navbarDarkDrawerLabel">Menu</p>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body mb-2 md:mb-0">
                        <ul class="nav navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/cines.html">Cines</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/peliculas.html">Películas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/promociones.html">Promociones</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/nosotros.html">Nosotros</a>
                                <!-- Clase para seleccionar: active -->
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>

    <main>
        <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-autoplay="true" data-bs-pause="hover">
            <div class="carousel-inner">
                <!-- Imágenes del Carrusel -->
                <div class="carousel-item active " data-bs-interval="2000">
                    <!-- data-bs-interval="2000" controla el tiempo (2s) -->
                    <img src="./assets/banners/Combo-Street-Fighter_Banner-Web.png" class="d-block w-100 rounded-5"
                        alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="./assets/banners/hot_dog_prime_banner_web_desktop.jpg" class="d-block w-100 rounded-5"
                        alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="./assets/banners/preventa_arirang_web-desktop.jpg" class="d-block w-100 rounded-5"
                        alt="...">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <!-- Indicador de Slide del Carrusel -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>

                <!-- Controles del Carrusel -->
                <div>
                    <button class="btn-icon btn-sm carousel-control-play-pause" type="button"
                        data-bs-target="#carouselExampleAutoplaying" aria-label="Pause" data-bs-pause-label="Pause"
                        data-bs-play-label="Play">
                        <span class="carousel-icon-pause" aria-hidden="true"></span>
                        <span class="carousel-icon-play" aria-hidden="true"></span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleAutoplaying"
                        data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleAutoplaying"
                        data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>

        <section class="home-movies-container">
            <h1>Películas</h1>
            <!-- 
            Estos son controles NO para cambiar de página, sino para mostrar contenido
            (las películas) de manera dinámica dependiendo de la selección del usuario 
            -->
            <div class="movies-tabs">
                <button class="movies-tabs__tab movies-tabs__tab-selected" type="button">En cartelera</button>
                <button class="movies-tabs__tab" type="button">Preventa</button>
                <button class="movies-tabs__tab" type="button">Próximos estrenos</button>
            </div>

            <!-- 
            En esta sección, dependiendo del botón (tab) seleccionado, se debería cambiar
            cambiar las películas que se muestren, pero la estructura sería la misma.
            -->
            <ul class="movies-preview">
                <li class="movies-preview__card"><img src="./assets/movie-posters/avengers-endgame.jfif"
                        alt="póster de la película Avengers: Endgame"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/spiderman_brand-new-day.jfif"
                        alt="póster de la película Spiderman: Brand New Day"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/madoka-magica.jfif"
                        alt="póster de la película Puella Magi Madoka Magica: Walpurgisnacht Rising"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/verity.jfif"
                        alt="póster de la Verity: La Sombra de un Engaño"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/street-fighter.jfif"
                        alt="póster de la Verity: La Sombra de un Engaño">
                </li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/hunger_games-sinsajo_parte_2.jfif"
                        alt="póster de la Verity: La Sombra de un Engaño">
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <nav>
            <ul class="footer_links-list">
                <li><a href="#">Términos y condiciones</a></li>
                <li><a href="#">Trabaja con nosotros</a></li>
            </ul>
        </nav>
        <p class="footer__copyright">Kinoura &copy Perú 2026. Todos los derechos reservados.</p>
    </footer>
</body>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinoura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/main.css">
    <!-- <link rel="stylesheet" href="./css/styles.css"> -->
</head>

<body>
    <header>
        <nav class="main-navbar navbar navbar-expand-md bg-1" data-bs-theme="dark">
            <div class="container-fluid">
                <!-- Main Heading: Kinoura -->
                <a class="navbar-brand" href="#"><img src="./assets/kinoura-logo-white.png"
                        alt="Botón a Home con el logo de Kinoura"></a>

                <!-- Icono de Menu Hamburgesa-->
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end bg-1" tabindex="-1" id="navbarMain"
                    aria-labelledby="navbarMainLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="navbarMainLabel">Menú</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav me-auto mb-2 mb-md-0">
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/cines.html">Cines</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/peliculas.html">Películas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/promociones.html">Promociones</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/nosotros.html">Nosotros</a>
                                <!-- Clase para seleccionar: active -->
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div id="carouselAutoplaying" class="carousel slide" data-bs-ride="carousel" data-bs-pause="hover">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselAutoplaying" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselAutoplaying" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselAutoplaying" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <!-- Imágenes del Carrusel -->
                <div class="carousel-item active" data-bs-interval="2000">
                    <!-- data-bs-interval="2000" controla el tiempo (2s) -->
                    <img class="carousel__image--mobile w-100"
                        src="./assets/banners/mobile/Combo-Street-Fighter_Banner-Web-Mobile.png"
                        alt="Banner Street Fighter para móvil">
                    <img class="carousel__image--desktop w-100"
                        src="./assets/banners/Combo-Street-Fighter_Banner-Web.png"
                        alt="Banner Street Fighter para escritorio">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img class="carousel__image--mobile w-100"
                        src="./assets/banners/mobile/HOT_DOG_PRIME_banner_web_mobile_937x1424px.jpg"
                        alt="Banner Hot Dog Prime para móvil">
                    <img class="carousel__image--desktop w-100"
                        src="./assets/banners/hot_dog_prime_banner_web_desktop.jpg"
                        alt="Banner Hot Dog Prime para escritorio">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img class="carousel__image--mobile w-100"
                        src="./assets/banners/mobile/preventa_arirang_web-mobile.jpg"
                        alt="Banner preventa Arirang para móvil">
                    <img class="carousel__image--desktop w-100" src="./assets/banners/preventa_arirang_web-desktop.jpg"
                        alt="Banner preventa Arirang para escritorio">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselAutoplaying"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselAutoplaying"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <section class="home-movies-container">
            <h1>Películas</h1>
            <!-- 
            Estos son controles NO para cambiar de página, sino para mostrar contenido
            (las películas) de manera dinámica dependiendo de la selección del usuario 
            -->
            <div class="movies-tabs">
                <button class="movies-tabs__tab movies-tabs__tab-selected" type="button">En cartelera</button>
                <button class="movies-tabs__tab" type="button">Preventa</button>
                <button class="movies-tabs__tab" type="button">Próximos estrenos</button>
            </div>

            <!-- 
            En esta sección, dependiendo del botón (tab) seleccionado, se debería cambiar
            cambiar las películas que se muestren, pero la estructura sería la misma.
            -->
            <ul class="movies-preview">
                <li class="movies-preview__card"><img src="./assets/movie-posters/avengers-endgame.jfif"
                        alt="póster de la película Avengers: Endgame"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/spiderman_brand-new-day.jfif"
                        alt="póster de la película Spiderman: Brand New Day"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/madoka-magica.jfif"
                        alt="póster de la película Puella Magi Madoka Magica: Walpurgisnacht Rising"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/verity.jfif"
                        alt="póster de la Verity: La Sombra de un Engaño"></li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/street-fighter.jfif"
                        alt="póster de la Verity: La Sombra de un Engaño">
                </li>
                <li class="movies-preview__card"><img src="./assets/movie-posters/hunger_games-sinsajo_parte_2.jfif"
                        alt="póster de la Verity: La Sombra de un Engaño">
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <nav>
            <ul class="footer_links-list">
                <li><a href="#">Términos y condiciones</a></li>
                <li><a href="#">Trabaja con nosotros</a></li>
            </ul>
        </nav>
        <p class="footer__copyright">Kinoura &copy Perú 2026. Todos los derechos reservados.</p>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
